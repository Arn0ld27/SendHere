<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="container">
  <div class="card" style="max-width:400px">
    <h1>Admin Login</h1>
    <p class="subtitle">Enter password to access dashboard</p>
    <label for="adminPass">Password</label>
    <input id="adminPass" type="password" placeholder="••••••••" onkeypress="if(event.key==='Enter')login()">
    <button id="loginBtn" onclick="login()" style="width:100%;margin-top:20px;padding:15px;background:#5865e8;color:white;font-weight:800">LOGIN</button>
    <div id="loginMsg" class="message"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboardScreen" style="display:none">
  <header>
    <div>
      <div class="eyebrow">INSTRUCTOR DASHBOARD</div>
      <h1>Submission Monitor</h1>
      <p>View student Google Drive submissions in one place.</p>
    </div>
    <div>
      <button onclick="loadSubmissions()" class="refresh">Refresh</button>
      <button onclick="logout()" class="refresh">Logout</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><span>Total</span><strong id="total">0</strong></div>
    <div class="stat"><span>Approved</span><strong id="approved">0</strong></div>
    <div class="stat"><span>Pending</span><strong id="pending">0</strong></div>
    <div class="stat"><span>Latest</span><strong id="latest">—</strong></div>
  </section>

  <div class="toolbar" style="display:flex;gap:10px;flex-wrap:wrap">
    <input id="search" type="search" placeholder="Search student name..." oninput="render()" style="flex:1;min-width:200px">
    <select id="sectionFilter" onchange="render()">
      <option value="">All Sections</option>
      <option value="A">BSCS 2A</option>
      <option value="B">BSCS 2B</option>
    </select>
    <select id="statusFilter" onchange="render()">
      <option value="">All Status</option>
      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Student Name</th>
          <th>Section</th>
          <th>Date / Time</th>
          <th>Drive</th>
          <th>Code</th>
          <th>Status</th>
          <th>Score</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="9" class="empty">Loading submissions...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby98QvlSPYEW8UMBwOtJGeBa9y2Vfjpnzvua_KQn0Ud2jodU9iFgvIDjaORb7nSpd8d/exec";
let submissions = [];
let adminPassword = "";

/* ---------- SESSION PERSISTENCE ---------- */
const SESSION_KEY = "teacherDashboardSession";

function saveSession(password) {
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ password, loggedInAt: Date.now() }));
  } catch (e) { /* ignore */ }
}

function getSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function clearSession() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}

/* ---------- AUTO RESUME ON REFRESH ---------- */
window.addEventListener("DOMContentLoaded", () => {
  const session = getSession();
  if (session && session.password) {
    adminPassword = session.password;
    showDashboard();
    loadSubmissions();
  } else {
    showLogin();
  }
});

function showLogin() {
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("dashboardScreen").style.display = "none";
}

function showDashboard() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("dashboardScreen").style.display = "block";
}

/* ---------- LOGIN ---------- */
function login() {
  const pass = document.getElementById("adminPass").value;
  if (!pass) {
    const m = document.getElementById("loginMsg");
    m.textContent = "Please enter password.";
    m.className = "message error";
    return;
  }

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({action: "login", password: pass})
  })
  .then(r => r.json())
  .then(res => {
    if (res.success) {
      adminPassword = pass;
      saveSession(pass);          // ← remember login
      showDashboard();
      loadSubmissions();
    } else {
      const m = document.getElementById("loginMsg");
      m.textContent = res.message;
      m.className = "message error";
    }
  })
  .catch(() => {
    const m = document.getElementById("loginMsg");
    m.textContent = "Connection failed. Check your internet or URL.";
    m.className = "message error";
  });
}

function logout() {
  clearSession();
  adminPassword = "";
  location.reload();
}

/* ---------- LOAD SUBMISSIONS ---------- */
async function loadSubmissions() {
  const body = document.getElementById("tableBody");
  body.innerHTML = '<tr><td colspan="9" class="empty">Loading submissions...</td></tr>';
  try {
    const res = await fetch(SCRIPT_URL);
    submissions = await res.json();
    render();
  } catch (e) {
    body.innerHTML = '<tr><td colspan="9" class="empty">Unable to load submissions.</td></tr>';
  }
}

/* ---------- RENDER TABLE ---------- */
function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const sec = document.getElementById("sectionFilter").value;
  const stat = document.getElementById("statusFilter").value;

  const filtered = submissions.filter(s =>
    (String(s.name).toLowerCase().includes(q)) &&
    (!sec || s.section === sec) &&
    (!stat || s.status === stat)
  );

  document.getElementById("total").textContent = submissions.length;
  document.getElementById("approved").textContent = submissions.filter(s => s.status === "Approved").length;
  document.getElementById("pending").textContent = submissions.filter(s => s.status === "Pending").length;
  document.getElementById("latest").textContent = submissions.length ? submissions[submissions.length - 1].date : "—";

  const body = document.getElementById("tableBody");
  if (!filtered.length) {
    body.innerHTML = '<tr><td colspan="9" class="empty">No submissions found.</td></tr>';
    return;
  }

  body.innerHTML = filtered.map((s, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><strong>${escapeHtml(s.name)}</strong></td>
      <td>${escapeHtml(s.section)}</td>
      <td>${escapeHtml(s.date)}</td>
      <td><a class="drive-btn" href="${safeUrl(s.link)}" target="_blank" rel="noopener">OPEN</a></td>
      <td><code class="code-tag">${escapeHtml(s.code) || "—"}</code></td>
      <td><span class="badge ${s.status.toLowerCase()}">${escapeHtml(s.status)}</span></td>
      <td><strong>${escapeHtml(s.score) || "—"}</strong></td>
      <td>
        <div class="action-cell">
          ${s.status === "Approved"
            ? `<span class="approved-text">Approved</span>`
            : `<input type="number" class="score-input" id="score-${s.rowIndex}" placeholder="Score" min="0">
               <button class="approve-btn" onclick="approve(${s.rowIndex})">Approve</button>`
          }
          <button class="delete-btn" onclick="deleteSubmission(${s.rowIndex})">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");
}

/* ---------- APPROVE ---------- */
async function approve(rowIndex) {
  const scoreInput = document.getElementById(`score-${rowIndex}`);
  const score = scoreInput.value.trim();
  if (score === "") { alert("Please enter a score."); return; }

  const sub = submissions.find(s => s.rowIndex === rowIndex);
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({
      action: "approve",
      password: adminPassword,
      timestamp: sub.timestamp,
      name: sub.name,
      score: score
    })
  });
  const result = await res.json();
  if (result.success) loadSubmissions();
  else alert("Failed: " + result.message);
}

/* ---------- DELETE ---------- */
async function deleteSubmission(rowIndex) {
  if (!confirm("Are you sure you want to delete this submission? This cannot be undone.")) return;

  const sub = submissions.find(s => s.rowIndex === rowIndex);
  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({
      action: "delete",
      password: adminPassword,
      timestamp: sub.timestamp,
      name: sub.name
    })
  });
  const result = await res.json();
  if (result.success) loadSubmissions();
  else alert("Failed: " + result.message);
}

/* ---------- HELPERS ---------- */
function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function safeUrl(url) {
  return /^https:\/\/(drive|docs)\.google\.com\//i.test(url) ? url : "#";
}
</script>
</body>
</html>
